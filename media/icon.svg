<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- Auspex: the augur who read the signs before anyone acted. An eye, not a
       lens — RedLens owns the magnifier, and two products from one publisher
       must not share a silhouette in the activity bar. -->
  <path d="M2.4 12C5.3 7.1 8.6 4.7 12 4.7s6.7 2.4 9.6 7.3c-2.9 4.9-6.2 7.3-9.6 7.3S5.3 16.9 2.4 12Z" stroke-width="1.9"/>
  <!-- Rows of data where the iris would be. The middle one is shorter so the
       three do not read as a hamburger menu at 24px. -->
  <line x1="8.8" y1="9.6" x2="15.2" y2="9.6" stroke-width="1.7"/>
  <line x1="8.8" y1="12"  x2="13.1" y2="12"  stroke-width="1.7"/>
  <line x1="8.8" y1="14.4" x2="15.2" y2="14.4" stroke-width="1.7"/>
</svg>
